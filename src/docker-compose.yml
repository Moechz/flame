# ===========================================================================
# Flame for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : pawelmalak/flame:multiarch2.4.0 (Docker Hub, used unmodified)
#                  -> https://github.com/pawelmalak/flame
#                  This is the upstream multi-architecture build of 2.4.0. Its
#                  manifest list covers amd64, arm64 and arm/v7:
#                    index  sha256:1b54ea03eb880baa2b54b1e9886ce0a36e15f67e2cd24f062e4bfa8db371726d
#                    amd64  sha256:8da1ba1901cdbb8a67bea6e395922328da6cf6240708852d48dcb9c4b149da46
#                    arm64  sha256:1f167a21793a8ae19310b180721a8aa0bacfb2a50ba3fe4aca3a6299104f3b18
#                    arm/v7 sha256:93da98a9fa7a65238945bdfbb0ce1a75ae644fbf65326fe64573c2b47359de29
#                  The plain "2.4.0" tag is an amd64-only manifest, so an
#                  aarch64 NAS cannot run it (exec format error, "installation
#                  failed - cannot be opened"). Both architectures of this
#                  package therefore use the multi-arch tag.
#
# Ports   : host 8027 -> container 5005. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/flamedocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the image writes its theme CSS into /app/public at startup, which a non-root
#           container cannot do; this wrapper runs the server from a writable copy in /tmp
#           and keeps the persistent data folder on the mounted volume.
# Password: the image bakes PASSWORD=flame_password into its environment. The
#           wrapper generates a random password on first start and exports it,
#           so no credential is stored in this file. PASSWORD is set to an
#           empty string here only to keep the image default out of the
#           container environment.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  flamedocker:
    image: pawelmalak/flame:multiarch2.4.0@sha256:1b54ea03eb880baa2b54b1e9886ce0a36e15f67e2cd24f062e4bfa8db371726d
    container_name: flamedocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    ports:
      - "8027:5005"
    environment:
      TZ: "Asia/Shanghai"
      PASSWORD: ""
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /Volume1/DockerAppData/flamedocker/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5005/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8027
    protocol: http
